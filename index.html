<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>Comic Vault Recovery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fa;padding:22px;min-height:100vh}
main{max-width:1000px;margin:auto}.panel{background:#11151d;border:1px solid #2b313d;border-radius:16px;padding:18px;margin:16px 0}
h1{margin-bottom:6px}p{color:#aab2c0;line-height:1.5}.status{font-weight:700;padding:12px;border-radius:10px;background:#191e28}
.ok{color:#9be2ae}.warn{color:#ffd28b}.bad{color:#ff9ca4}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button,label.button{border:0;border-radius:10px;padding:12px 15px;background:#d9293d;color:white;font-weight:700;cursor:pointer}
button.secondary,label.secondary{background:#202631;color:#f5f7fa}
input[type=file]{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-top:18px}
.card{background:#121720;border:1px solid #2b313d;border-radius:13px;overflow:hidden}.cover{aspect-ratio:2/3;background:#1a202a;display:flex;align-items:center;justify-content:center;color:#6f7888;font-size:34px}
.cover img{width:100%;height:100%;object-fit:cover}.meta{padding:10px}.meta strong{display:block}.meta small{display:block;color:#9da6b5;margin-top:4px}
pre{white-space:pre-wrap;word-break:break-word;color:#aab2c0;font-size:12px}
</style>
</head>
<body>
<main>
<h1>Comic Vault Recovery</h1>
<p>Version minimale destinée uniquement à lire, afficher et sauvegarder la base locale existante. Elle n’utilise ni service worker, ni carrousel, ni caméra, ni API externe.</p>

<section class="panel">
<div id="status" class="status warn">Ouverture de la base locale…</div>
<div class="actions">
<button id="retry" class="secondary">Réessayer la lecture</button>
<button id="export" disabled>Exporter les comics</button>
</div>
<p id="details"></p>
</section>

<section class="panel">
<strong>Comics retrouvés : <span id="count">0</span></strong>
<div id="grid" class="grid"></div>
</section>

<section class="panel">
<strong>Diagnostic</strong>
<pre id="diag"></pre>
</section>
</main>
<script>
const DB="comic-vault", STORE="comics";
let db=null, comics=[];
const $=s=>document.querySelector(s);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function log(s){$("#diag").textContent += s+"\\n"}
function setStatus(text,kind){$("#status").textContent=text;$("#status").className="status "+kind}
function openDB(){
 return new Promise((resolve,reject)=>{
   log("indexedDB.open('comic-vault', 1)");
   const r=indexedDB.open(DB,1);
   r.onupgradeneeded=e=>{
     // If the DB truly does not exist, create the expected store without deleting anything.
     const d=e.target.result;
     log("onupgradeneeded: ancienne version "+e.oldVersion);
     if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id"});
   };
   r.onsuccess=e=>{db=e.target.result;log("Base ouverte. Version: "+db.version+"; stores: "+[...db.objectStoreNames].join(", "));resolve()};
   r.onerror=()=>reject(r.error||new Error("Erreur IndexedDB"));
   r.onblocked=()=>reject(new Error("Ouverture IndexedDB bloquée"));
 });
}
function readAll(){
 return new Promise((resolve,reject)=>{
   try{
     const t=db.transaction(STORE,"readonly");
     const r=t.objectStore(STORE).getAll();
     r.onsuccess=()=>resolve(r.result||[]);
     r.onerror=()=>reject(r.error||new Error("Lecture impossible"));
   }catch(e){reject(e)}
 });
}
function render(){
 $("#count").textContent=comics.length;
 $("#grid").innerHTML=comics.map(c=>`<article class="card"><div class="cover">${c.cover?`<img src="${c.cover}" alt="">`:"▣"}</div><div class="meta"><strong>${esc(c.title||"Sans titre")}</strong><small>${esc([c.series,c.issue].filter(Boolean).join(" · "))}</small><small>${esc(c.isbn||"")}</small></div></article>`).join("");
 $("#export").disabled=!comics.length;
}
async function recover(){
 $("#diag").textContent="";
 setStatus("Ouverture de la base locale…","warn");
 try{
   if(db)try{db.close()}catch(e){}
   await openDB();
   comics=await readAll();
   render();
   if(comics.length){
     setStatus("Collection retrouvée : "+comics.length+" comics.","ok");
     $("#details").textContent="Fais immédiatement une sauvegarde avec « Exporter les comics ».";
   }else{
     setStatus("La base s’ouvre, mais aucun comics n’est visible dans ce contexte de stockage.","warn");
     $("#details").textContent="Ne supprime aucune donnée Safari. Vérifie que cette page est publiée exactement sur le même domaine GitHub Pages que Comic Vault.";
   }
   log("Nombre d'enregistrements lus: "+comics.length);
 }catch(e){
   console.error(e);setStatus("Impossible de lire la base locale.","bad");
   $("#details").textContent="Ne supprime pas les données Safari.";
   log("ERREUR: "+(e?.name||"")+" "+(e?.message||e));
 }
}
$("#retry").onclick=recover;
$("#export").onclick=()=>{
 const payload={version:1,recoveredAt:new Date().toISOString(),source:"Comic Vault Recovery",comics};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="comic-vault-RECOVERY-"+new Date().toISOString().slice(0,10)+".json";
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
};
recover();
</script>
</body>
</html>
