<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Comic Vault V4</title><link rel="stylesheet" href="./style.css"></head><body>
<header><b>COMIC <i>VAULT</i><small> V4</small></b><button id="add">＋ Ajouter</button></header><main>
<section id="home" class="view active"><h1>Ma bibliothèque</h1><div class="stats"><div><b id="total">0</b><span>Comics</span></div><div><b id="read">0</b><span>Lus</span></div><div><b id="unread">0</b><span>À lire</span></div><div><b id="fav">0</b><span>Favoris</span></div></div><h2>Ajouts récents</h2><div id="recent" class="grid"></div></section>
<section id="collection" class="view"><div class="head"><h1>Collection</h1><div><button id="carMode">◉ Carrousel</button><button id="gridMode" class="secondary">▦ Grille</button></div></div><div id="carWrap"><div id="carousel" class="carousel"></div><div id="carInfo"></div><p class="hint">Glisse à gauche ou à droite · touche la couverture centrale</p></div><div id="collectionGrid" class="grid" hidden></div></section>
<section id="series" class="view"><h1>Séries</h1><div class="tools"><input id="seriesQ" placeholder="Rechercher une série…"><button id="missing">✦ À compléter</button></div><p id="seriesNote"></p><div id="seriesGrid" class="groups"></div><div id="seriesDetail" hidden></div></section>
<section id="search" class="view"><h1>Recherche</h1><input id="q" class="big" placeholder="Titre, série, auteur, personnage, boîte…"><div id="searchGrid" class="grid"></div></section>
<section id="boxes" class="view"><h1>Mes boîtes</h1><div id="boxesGrid" class="groups"></div></section>
<section id="favorites" class="view"><h1>Favoris</h1><div id="favGrid" class="grid"></div></section>
<section id="settings" class="view"><h1>Réglages</h1><div class="panel"><h2>Migration sécurisée</h2><p id="seedState">Vérification de la collection V4…</p><button id="seedBtn">Importer mes 54 comics préparés</button><div id="prog" hidden><div class="bar"><span></span></div><small></small></div></div><div class="panel"><h2>Sauvegarde</h2><button id="export">Exporter les données</button></div></section>
<section id="detail" class="view"><button id="back" class="secondary">← Retour</button><div id="detailBody"></div></section></main>
<nav><button data-v="home" class="active">⌂<span>Accueil</span></button><button data-v="collection">▦<span>Collection</span></button><button data-v="series">▤<span>Séries</span></button><button data-v="search">⌕<span>Recherche</span></button><button id="more">•••<span>Plus</span></button></nav><div id="moreMenu" hidden><button data-more="boxes">▣ Mes boîtes</button><button data-more="favorites">★ Favoris</button><button data-more="settings">⚙ Réglages</button></div>
<dialog id="editor"><form id="form"><div class="head"><h2 id="formTitle">Ajouter un comics</h2><button type="button" id="close" class="secondary">✕</button></div><input id="id" type="hidden"><div class="form"><label>Titre<input id="title" required></label><label>Série<input id="seriesField"></label><label>Tome / numéro<input id="issue"></label><label>Éditeur<input id="publisher"></label><label>Année<input id="year"></label><label>Scénariste<input id="writer"></label><label>Dessinateur<input id="artist"></label><label>Statut<select id="status"><option>À lire</option><option>En cours</option><option>Lu</option></select></label><label>Note /10<input id="rating" type="number" min="0" max="10" step=".5"></label><label>Boîte<input id="box"></label><label>Position<input id="position"></label><label class="wide">Personnages<input id="characters"></label><label class="wide">Mots-clés<input id="keywords"></label><label class="wide">Résumé<textarea id="summary"></textarea></label><label class="wide">Mon avis<textarea id="review"></textarea></label><label class="wide">Couverture<input id="coverFile" type="file" accept="image/*"><img id="preview"></label><label class="wide check"><input id="favorite" type="checkbox"> ★ Favori</label></div><div class="actions"><button type="button" id="delete" class="danger">Supprimer</button><button type="submit">Enregistrer</button></div></form></dialog>
<script src="./app.js"></script></body></html>
